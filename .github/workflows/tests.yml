name: tests
# Push as well as pull_request -- this repo commits straight to feature
# branches, so a pull_request-only trigger would never fire.
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: pytest
        # No font install needed: the typeface ships inside the package
        # (src/sermonflow/assets/fonts), so rendering tests run against the
        # real face in CI.
        # Unpiped on purpose -- a pipe would mask the exit code.
        run: python -m pytest -q
